<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" role="img" aria-label="Networking: Cisco, Wireshark, pfSense, TCP/IP, VLAN, VPN, DNS">
<style>
.hd{font:600 15px 'JetBrains Mono','Fira Code',Consolas,Menlo,monospace}
.lbl{font:500 12px 'Segoe UI','Inter',Helvetica,Arial,sans-serif;fill:#8b949e;text-anchor:middle}
.type{animation:type 1.2s steps(18,end) .1s both}
@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.cur{animation:blink 1s step-end infinite}@keyframes blink{50%{opacity:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.5)}to{opacity:1;transform:none}}
.float{animation:float 3.2s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.ring{fill:none;stroke:#39c5cf;stroke-width:2;opacity:0;animation:ring 4.25s ease-in-out infinite}
@keyframes ring{0%,100%{opacity:0}6%{opacity:1}16%{opacity:0}}
.sweep{animation:sweep 3.5s ease-in-out infinite}
@keyframes sweep{from{transform:translateX(-260px)}to{transform:translateX(880px)}}
</style>
<defs><linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#39c5cf" stop-opacity="0"/><stop offset=".5" stop-color="#39c5cf"/><stop offset="1" stop-color="#39c5cf" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect width="880" height="150" rx="14"/></clipPath></defs>
<g clip-path="url(#c)">
<rect width="880" height="150" fill="#0d1117"/>
<text x="20" y="28" class="hd"><tspan fill="#39c5cf">❯</tspan><tspan fill="#8b949e"> NETWORKING</tspan></text>
<text x="860" y="28" class="hd" text-anchor="end" fill="#484f58"><tspan class="type">ls ~/stack/network</tspan><tspan class="cur" fill="#39c5cf">▌</tspan></text>
<rect x="20" y="38" width="840" height="1" fill="#21262d"/>
<rect class="sweep" x="0" y="37.5" width="240" height="2" fill="url(#ln)"/>
<g class="pop" style="animation-delay:0.40s"><g class="float" style="animation-delay:-0.00s"><rect x="155.0" y="50" width="54" height="54" rx="12.4" fill="#242938"/><image href="data:image/svg+xml;base64," x="165.8" y="60.8" width="32.4" height="32.4"/><rect class="ring" x="153.0" y="48" width="58" height="58" rx="14" style="animation-delay:1.50s"/><text x="182.0" y="124" class="lbl">Cisco</text></g></g><g class="pop" style="animation-delay:0.49s"><g class="float" style="animation-delay:-0.45s"><rect x="241.0" y="50" width="54" height="54" rx="12.4" fill="#242938"/><image href="data:image/svg+xml;base64," x="251.8" y="60.8" width="32.4" height="32.4"/><rect class="ring" x="239.0" y="48" width="58" height="58" rx="14" style="animation-delay:1.75s"/><text x="268.0" y="124" class="lbl">Wireshark</text></g></g><g class="pop" style="animation-delay:0.58s"><g class="float" style="animation-delay:-0.90s"><rect x="327.0" y="50" width="54" height="54" rx="12.4" fill="#242938"/><image href="data:image/svg+xml;base64," x="337.8" y="60.8" width="32.4" height="32.4"/><rect class="ring" x="325.0" y="48" width="58" height="58" rx="14" style="animation-delay:2.00s"/><text x="354.0" y="124" class="lbl">pfSense</text></g></g><g class="pop" style="animation-delay:0.67s"><g class="float" style="animation-delay:-1.35s"><rect x="413.0" y="50" width="54" height="54" rx="12.4" fill="#242938"/><text x="440.0" y="77.0" fill="#39c5cf" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-weight="700" font-size="11.9" text-anchor="middle" dominant-baseline="central">TCP/IP</text><rect class="ring" x="411.0" y="48" width="58" height="58" rx="14" style="animation-delay:2.25s"/><text x="440.0" y="124" class="lbl">TCP/IP</text></g></g><g class="pop" style="animation-delay:0.76s"><g class="float" style="animation-delay:-1.80s"><rect x="499.0" y="50" width="54" height="54" rx="12.4" fill="#242938"/><text x="526.0" y="77.0" fill="#e3b341" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-weight="700" font-size="16.2" text-anchor="middle" dominant-baseline="central">VLAN</text><rect class="ring" x="497.0" y="48" width="58" height="58" rx="14" style="animation-delay:2.50s"/><text x="526.0" y="124" class="lbl">VLAN</text></g></g><g class="pop" style="animation-delay:0.85s"><g class="float" style="animation-delay:-2.25s"><rect x="585.0" y="50" width="54" height="54" rx="12.4" fill="#242938"/><text x="612.0" y="77.0" fill="#3fb950" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-weight="700" font-size="16.2" text-anchor="middle" dominant-baseline="central">VPN</text><rect class="ring" x="583.0" y="48" width="58" height="58" rx="14" style="animation-delay:2.75s"/><text x="612.0" y="124" class="lbl">VPN</text></g></g><g class="pop" style="animation-delay:0.94s"><g class="float" style="animation-delay:-2.70s"><rect x="671.0" y="50" width="54" height="54" rx="12.4" fill="#242938"/><text x="698.0" y="77.0" fill="#a371f7" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-weight="700" font-size="16.2" text-anchor="middle" dominant-baseline="central">DNS</text><rect class="ring" x="669.0" y="48" width="58" height="58" rx="14" style="animation-delay:3.00s"/><text x="698.0" y="124" class="lbl">DNS</text></g></g>
</g>
<rect x=".5" y=".5" width="879" height="149" rx="14" fill="none" stroke="#30363d"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-label="Toek Sopanha — Red Team, Penetration Testing, Offensive Security">
<style>
text{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,Menlo,monospace}
.cur{animation:blink 1s step-end infinite}@keyframes blink{50%{opacity:0}}
.fade{animation:fade .8s ease-out both}@keyframes fade{from{opacity:0}to{opacity:1}}
.scan{animation:scan 5s linear infinite}

.name{font-size:54px;font-weight:800;letter-spacing:6px}
.g1{animation:g1 4s steps(1) infinite}.g2{animation:g2 4s steps(1) infinite}
@keyframes g1{0%,88%,100%{transform:none;opacity:0}90%{transform:translate(-4px,1px);opacity:.9;clip-path:inset(10% 0 55% 0)}93%{transform:translate(3px,-1px);opacity:.9;clip-path:inset(60% 0 8% 0)}96%{opacity:0}}
@keyframes g2{0%,89%,100%{transform:none;opacity:0}91%{transform:translate(4px,0);opacity:.7;clip-path:inset(40% 0 30% 0)}94%{transform:translate(-3px,1px);opacity:.7;clip-path:inset(5% 0 75% 0)}97%{opacity:0}}
.main{animation:jit 4s steps(1) infinite}@keyframes jit{0%,89%,100%{transform:none}92%{transform:translateX(2px)}95%{transform:translateX(-1px)}}
.type{animation:type 3s steps(53,end) 1s both}
@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.spin{transform-origin:755px 136px;animation:spin 12s linear infinite}.spinr{transform-origin:755px 136px;animation:spin 8s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 1.6s ease-out infinite}
@keyframes ping{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(4)}}
.lock{animation:lock 2s steps(1) infinite}@keyframes lock{0%,60%{opacity:1}61%,100%{opacity:.25}}

@keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(300px)}}</style>
<defs><linearGradient id="sl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".07"/></linearGradient>
<pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern></defs>
<rect width="880" height="260" fill="#000000"/>
<rect width="880" height="260" fill="url(#grid)"/>
<path d="M10 24V10H24 M856 10H870V24 M10 236V250H24 M856 250H870V236" fill="none" stroke="#ffffff" stroke-width="1.5"/>

<text x="30" y="40" fill="#555555" font-size="11" letter-spacing="2">OP://RED_TEAM.INIT</text>
<text x="850" y="40" fill="#555555" font-size="11" letter-spacing="2" text-anchor="end"><tspan class="cur" fill="#ff2b2b">●</tspan> REC · KH</text>
<g class="fade">
<text x="40" y="112" class="name g1" fill="#ff2b2b">TOEK SOPANHA</text>
<text x="40" y="112" class="name g2" fill="#9a9a9a">TOEK SOPANHA</text>
<text x="40" y="112" class="name main" fill="#ffffff">TOEK SOPANHA</text>
</g>
<rect x="40" y="130" width="54" height="3" fill="#ff2b2b"/>
<rect x="98" y="131" width="420" height="1" fill="#262626"/>
<text x="40" y="160" fill="#ffffff" font-size="14" font-weight="700" letter-spacing="2" class="fade">RED TEAM // PENETRATION TESTING // OFFSEC</text>
<text x="40" y="182" fill="#555555" font-size="11.5" letter-spacing="1" class="fade">base: it support · app support · devops · networking · soc</text>
<text x="40" y="222" fill="#ffffff" font-size="13.5"><tspan class="type">> target acquired. engagement authorized. let's begin</tspan><tspan class="cur" fill="#ff2b2b">█</tspan></text>
<circle cx="755" cy="136" r="70" fill="none" stroke="#333"/>
<g class="spin"><circle cx="755" cy="136" r="58" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-dasharray="4 10"/><rect x="754" y="62" width="2" height="8" fill="#ffffff" transform="rotate(0 755 136)"/><rect x="754" y="62" width="2" height="8" fill="#ffffff" transform="rotate(30 755 136)"/><rect x="754" y="62" width="2" height="8" fill="#ffffff" transform="rotate(60 755 136)"/><rect x="754" y="62" width="2" height="8" fill="#ffffff" transform="rotate(90 755 136)"/><rect x="754" y="62" width="2" height="8" fill="#ffffff" transform="rotate(120 755 136)"/><rect x="754" y="62" width="2" height="8" fill="#ffffff" transform="rotate(150 755 136)"/><rect x="754" y="62" width="2" height="8" fill="#ffffff" transform="rotate(180 755 136)"/><rect x="754" y="62" width="2" height="8" fill="#ffffff" transform="rotate(210 755 136)"/><rect x="754" y="62" width="2" height="8" fill="#ffffff" transform="rotate(240 755 136)"/><rect x="754" y="62" width="2" height="8" fill="#ffffff" transform="rotate(270 755 136)"/><rect x="754" y="62" width="2" height="8" fill="#ffffff" transform="rotate(300 755 136)"/><rect x="754" y="62" width="2" height="8" fill="#ffffff" transform="rotate(330 755 136)"/></g>
<g class="spinr"><circle cx="755" cy="136" r="40" fill="none" stroke="#ff2b2b" stroke-width="1.5" stroke-dasharray="60 20 10 20"/></g>
<path d="M671 136H733M777 136H839M755 56V114M755 158V216" stroke="#ffffff" stroke-opacity=".7"/>
<circle class="ping" cx="755" cy="136" r="4" fill="none" stroke="#ff2b2b"/>
<circle cx="755" cy="136" r="3.5" fill="#ff2b2b"/>
<text x="769" y="124" fill="#ff2b2b" font-size="10" font-weight="700" class="lock">LOCK</text>
<text x="755" y="238" fill="#555555" font-size="10" text-anchor="middle" letter-spacing="1">TGT 10.10.13.37</text>
<rect class="scan" width="880" height="40" fill="url(#sl)"/>
</svg>
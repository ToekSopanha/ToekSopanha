<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-label="Toek Sopanha — IT SUPPORT // APP SUPPORT // DEVOPS // NETWORK // SOC // PENTEST">
<style>
text{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,Menlo,monospace}
.cur{animation:blink 1s step-end infinite}@keyframes blink{50%{opacity:0}}
.scan{animation:scan 5s linear infinite}
.fade{animation:fade .8s ease-out both}@keyframes fade{from{opacity:0}to{opacity:1}}

.name{font-size:58px;font-weight:800;letter-spacing:6px}
.g1{animation:g1 4s steps(1) infinite}.g2{animation:g2 4s steps(1) infinite}
@keyframes g1{0%,88%,100%{transform:none;opacity:0}90%{transform:translate(-4px,1px);opacity:.8;clip-path:inset(10% 0 55% 0)}93%{transform:translate(3px,-1px);opacity:.8;clip-path:inset(60% 0 8% 0)}96%{opacity:0}}
@keyframes g2{0%,89%,100%{transform:none;opacity:0}91%{transform:translate(4px,0);opacity:.6;clip-path:inset(40% 0 30% 0)}94%{transform:translate(-3px,1px);opacity:.6;clip-path:inset(5% 0 75% 0)}97%{opacity:0}}
.main{animation:jit 4s steps(1) infinite}@keyframes jit{0%,89%,100%{transform:none}92%{transform:translateX(2px)}95%{transform:translateX(-1px)}}
.type{animation:type 2.6s steps(39,end) 1s both}
@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.dot{animation:blink 1.2s step-end infinite}
</style>
<defs><linearGradient id="sl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".07"/></linearGradient>
<pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern></defs>
<rect width="880" height="240" fill="#000000"/>
<rect width="880" height="240" fill="url(#grid)"/>
<path d="M10 24V10H24 M856 10H870V24 M10 216V230H24 M856 230H870V216" fill="none" stroke="#ffffff" stroke-width="1.5"/>
<text x="30" y="40" fill="#555555" font-size="11" letter-spacing="2">SYS://PROFILE.INIT</text>
<text x="850" y="40" fill="#555555" font-size="11" letter-spacing="2" text-anchor="end"><tspan class="dot" fill="#ffffff">●</tspan> ONLINE · KH</text>
<g class="fade">
<text x="440.0" y="122" class="name g1" fill="#9a9a9a" text-anchor="middle">TOEK SOPANHA</text>
<text x="440.0" y="122" class="name g2" fill="#555555" text-anchor="middle">TOEK SOPANHA</text>
<text x="440.0" y="122" class="name main" fill="#ffffff" text-anchor="middle">TOEK SOPANHA</text>
</g>
<rect x="180.0" y="142" width="520" height="1" fill="#262626"/>
<text x="440.0" y="168" fill="#9a9a9a" font-size="13" letter-spacing="1.5" text-anchor="middle" class="fade">IT SUPPORT // APP SUPPORT // DEVOPS // NETWORK // SOC // PENTEST</text>
<text x="440.0" y="204" fill="#ffffff" font-size="14" text-anchor="middle"><tspan class="type">> access granted. welcome to my profile</tspan><tspan class="cur">█</tspan></text>
<style>@keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(280px)}}</style><rect class="scan" width="880" height="40" fill="url(#sl)"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="370" viewBox="0 0 880 370" role="img" aria-label="Roadmap: foundation and networking done; ops, blue team and red team active; red team certs queued">
<style>
text{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,Menlo,monospace}
.cur{animation:blink 1s step-end infinite}@keyframes blink{50%{opacity:0}}
.fade{animation:fade .8s ease-out both}@keyframes fade{from{opacity:0}to{opacity:1}}
.scan{animation:scan 5s linear infinite}

.row{animation:fade .6s ease-out both}
.grow{transform-box:fill-box;transform-origin:top;animation:grow 1.4s cubic-bezier(.6,0,.2,1) .3s both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 1.6s ease-out infinite}
@keyframes ping{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(3.2)}}

@keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(410px)}}</style>
<defs><linearGradient id="sl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".07"/></linearGradient>
<pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern></defs>
<rect width="880" height="370" fill="#000000"/>
<rect width="880" height="370" fill="url(#grid)"/>
<path d="M10 24V10H24 M856 10H870V24 M10 346V360H24 M856 360H870V346" fill="none" stroke="#ffffff" stroke-width="1.5"/>

